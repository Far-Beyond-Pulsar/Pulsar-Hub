[workspace]
default-members = ["crates/installer"]
members = [
    "crates/installer",
    "crates/hub",
    "crates/patch-tool",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
# GPUI fork (WGPUI) — must match what Pulsar-Native uses
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "37bb0eeb4820e4e3c69d72a0cfed49924388bc68" }

# Enable all platform wgpu backends (metal=macOS, vulkan+dx12=Linux/Windows)
wgpu = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", rev = "fce5b80e8017304449124b12637ec324417e40c8", default-features = false, features = ["metal", "vulkan", "dx12", "wgsl", "webgpu"] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

# ---------- Pulsar-Native crates (git ref) ----------
PN = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }

ui               = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef", features = ["inspector", "flamegraph", "tree-sitter-languages"] }
ui-macros        = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_entry         = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
pulsar_auth      = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
engine_state     = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
engine_fs        = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef", default-features = false }
window_manager   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
friends_engine   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_common        = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_auth          = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_git_manager   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_multiplayer  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_friends       = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_settings      = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_types_common  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui_gen_macros    = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
pulsar-config    = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
pulsar_settings  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
engine_backend   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef", default-features = false }
pulsar-multiplayer-core = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
pulsar_reflection       = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }
pulsar_reflection_derive = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }

# ---------- Third-party ----------
anyhow = "1"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "tga", "gif", "webp"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "3"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
tracing = "0.1.41"
dashmap = "6.1.0"
parking_lot = "0.12"
directories = "6.0.0"
toml = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
lazy_static = "1.4"
event-listener = "5.4"
inventory = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
keyring = "3"
dotenvy = "0.15"
walkdir = "2.4"
similar = "3"
git2 = "0.21"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
dirs = "6.0"
once_cell = "1.20"
open = "5.0"
rfd = "0.17"
flate2 = "1.0"
tar = "0.4"
bsdiff = "0.2.1"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_must_use = "allow"
unused_mut = "allow"
deprecated = "allow"
non_upper_case_globals = "allow"
improper_ctypes_definitions = "allow"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

# One GPUI for the whole graph, from WGPUI itself (there is no vendored copy).
# Pulsar-Native's crates name `gpui-ce` by a path inside their own checkout, and
# other dependencies (Pulsar-Reflection, WGPUI-Motion, Mockaco) pin their own
# WGPUI revs; patching every one of those sources onto the single rev below
# keeps GPUI's types one set of types. The `//` URL spelling is what lets a
# patch point at a different rev of the same repository. Keep this rev equal
# to Pulsar-Native's `crates/ui/wgpui` submodule pin at the Native rev above.
[patch."https://github.com/Far-Beyond-Pulsar/WGPUI"]
gpui-ce = { git = "https://github.com//Far-Beyond-Pulsar/WGPUI", rev = "37bb0eeb4820e4e3c69d72a0cfed49924388bc68" }

[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Native"]
gpui-ce = { git = "https://github.com//Far-Beyond-Pulsar/WGPUI", rev = "37bb0eeb4820e4e3c69d72a0cfed49924388bc68" }
# Pulsar-Native's crates name Pulsar-Reflection by a path in their own checkout;
# resolve those to the same rev as every other copy (see the table below).
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }
pulsar_reflection_derive = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }
pulsar_reflection_codegen = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }
ui-macros = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }

[patch."https://github.com/Far-Beyond-Pulsar/PulsarConfig"]
pulsar-config = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e78e741aff538993cff27a6f42ae1286508687ef" }

# Pulsar-Native's own workspace redirects SceneDB to the rev carrying the
# `handle_ledger` + GPU tier API (`gpu::{Tier, TierSelector, TierSpan,
# register_segment_layout, Segment}`) that its `helio_component` codes
# against. A git dependency's `[patch]` table is inert when consumed from
# another workspace, so without this override the Pulsar-Native crates
# resolve the stale `c761890` rev (no `handle_ledger`) while Helio pulls a
# second, differing `pulsar_scenedb` -- both a compile failure and a split
# `World`/`ComponentId` type seam. Mirror Pulsar-Native's patch here; the
# `//`-spelled URL is what allows overriding the same source at a new rev.
[patch."https://github.com/Far-Beyond-Pulsar/SceneDB"]
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar//SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }

# Same story for Pulsar-Reflection: the SceneDB rev above pins its own
# `pulsar_reflection` (`b9dd888d`), while Pulsar-Native's crates use
# `745ee787`. Pulsar-Native unifies these with a patch in its own workspace;
# that patch is inert here, so without this the `Reflectable`/`SceneStore`
# types crossing the SceneDB seam split into two incompatible copies.
[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection"]
pulsar_reflection        = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }
pulsar_reflection_derive = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }
pulsar_reflection_codegen = { git = "https://github.com/Far-Beyond-Pulsar//Pulsar-Reflection", rev = "3ea37fc5e2819a24fe6a2a6c9d10c82ec985dc96" }
