[workspace]
default-members = ["crates/installer"]
members = [
    "crates/installer",
    "crates/hub",
    "crates/patch-tool",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
# GPUI fork (WGPUI) — must match what Pulsar-Native uses
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "0b555af11e80565429af9405ffd9d17fa832e3fe" }

# Enable all platform wgpu backends (metal=macOS, vulkan+dx12=Linux/Windows)
wgpu = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", rev = "fce5b80e8017304449124b12637ec324417e40c8", default-features = false, features = ["metal", "vulkan", "dx12", "wgsl", "webgpu"] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

# ---------- Pulsar-Native crates (git ref) ----------
PN = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }

ui               = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605", features = ["inspector", "flamegraph", "tree-sitter-languages"] }
ui-macros        = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_entry         = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
pulsar_auth      = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
engine_state     = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
engine_fs        = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605", default-features = false }
window_manager   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
friends_engine   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_common        = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_auth          = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_git_manager   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_friends       = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_settings      = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_types_common  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui_gen_macros    = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
pulsar-config    = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
pulsar_settings  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
engine_backend   = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605", default-features = false, features = ["networking"] }
pulsar-multiplayer-core = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
pulsar_reflection       = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "b0d9b957b00e695d005df4ab18becf82b377b740" }
pulsar_reflection_derive = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "b0d9b957b00e695d005df4ab18becf82b377b740" }

# ---------- Third-party ----------
anyhow = "1"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "tga", "gif", "webp"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "3"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
tracing = "0.1.41"
dashmap = "6.1.0"
parking_lot = "0.12"
directories = "6.0.0"
toml = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
lazy_static = "1.4"
event-listener = "5.4"
inventory = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
keyring = "3"
dotenvy = "0.15"
walkdir = "2.4"
similar = "3"
git2 = "0.21"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
dirs = "6.0"
once_cell = "1.20"
open = "5.0"
rfd = "0.17"
flate2 = "1.0"
tar = "0.4"
bsdiff = "0.2.1"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_must_use = "allow"
unused_mut = "allow"
deprecated = "allow"
non_upper_case_globals = "allow"
improper_ctypes_definitions = "allow"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

###################################
# Patch: redirect external git deps
# to Pulsar-Native's vendored copies
# so Cargo resolves a single copy of
# each crate in-tree.
###################################

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI"]
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
ui-macros = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }

[patch."https://github.com/Far-Beyond-Pulsar/PulsarConfig"]
pulsar-config = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "e35133a768d4bffef72a6815b9ab318f2d9d9605" }
