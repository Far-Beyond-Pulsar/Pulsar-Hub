[package]
name = "reqwest_client"
version = "0.5.0"
license = "Apache-2.0"
publish = false
edition.workspace = true

[lints]
workspace = true

[features]
test-support = []

[lib]
path = "src/reqwest_client.rs"
doctest = true

[dependencies]
gpui-ce.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
anyhow.workspace = true
log.workspace = true

# Self-contained TLS: bundled Mozilla roots + ring provider, so verification
# does not depend on the machine's certificate store or CPU feature set.
rustls = { version = "0.23.26", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
bytes = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
regex = "1.5"

[dev-dependencies]
gpui-ce.workspace = true
