[package]
name = "pulsar-installer"
version = "0.3.2"
edition.workspace = true
description = "Modern, cross-platform installer for the Pulsar game engine"
license = "Apache-2.0"
publish = false

[package.metadata.packager]
product-name = "Pulsar Hub"
identifier = "com.far-beyond-pulsar.pulsar-hub"
publisher = "Far Beyond Pulsar"
description = "Modern, cross-platform hub for the Pulsar game engine"
homepage = "https://github.com/Far-Beyond-Pulsar/Pulsar-Hub"
authors = ["Far Beyond Pulsar"]
license-file = "../../LICENSE-APACHE"
icons = ["../../assets/images/logo_sqrkl.png"]

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
package-name = "pulsar-hub"

[dependencies]
anyhow.workspace = true
gpui-ce.workspace = true
ui.workspace = true
pulsar-hub = { path = "../hub" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest_client = { path = "../reqwest_client" }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bsdiff.workspace = true
zstd.workspace = true
reqwest.workspace = true
tokio.workspace = true

[lints]
workspace = true
