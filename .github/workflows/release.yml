name: Release

on:
  push:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      previous_version: ${{ steps.check.outputs.previous_version }}
      has_previous: ${{ steps.check.outputs.has_previous }}
      package_name: ${{ steps.get-name.outputs.package_name }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get package name from crates/installer/Cargo.toml
        id: get-name
        run: |
          PACKAGE_NAME=$(grep -m1 '^name' crates/installer/Cargo.toml | sed 's/name\s*=\s*"\(.*\)"/\1/')
          PACKAGE_NAME=$(echo "$PACKAGE_NAME" | tr -d '[:space:]')
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package name: [$PACKAGE_NAME]"

      - name: Check if Cargo.toml version changed
        id: check
        run: |
          CURRENT_VERSION=$(grep -m1 version crates/installer/Cargo.toml | cut -d '"' -f2)
          git checkout HEAD^1
          PREVIOUS_VERSION=$(grep -m1 version crates/installer/Cargo.toml | cut -d '"' -f2)
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
            echo "has_previous=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREVIOUS_VERSION -> $CURRENT_VERSION"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "previous_version=" >> $GITHUB_OUTPUT
            echo "has_previous=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURRENT_VERSION"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v3

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false

  build-release:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_path: target/x86_64-unknown-linux-gnu/release
            asset_name: -linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_path: target/x86_64-pc-windows-msvc/release
            asset_name: -windows-x86_64.exe
            extension: .exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            bin_path: target/i686-pc-windows-msvc/release
            asset_name: -windows-i686.exe
            extension: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin_path: target/aarch64-pc-windows-msvc/release
            asset_name: -windows-arm64.exe
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_path: target/aarch64-apple-darwin/release
            asset_name: -macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openssl@1.1 protobuf
          echo "OPENSSL_DIR=$(brew --prefix openssl@1.1)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix protobuf)/bin:$PATH" >> $GITHUB_ENV
          brew link --force protobuf
          protoc --version

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxkbcommon-x11-0 libxkbcommon-x11-dev libasound2-dev

      - name: Build native
        uses: actions-rs/cargo@v1
        env:
          RUST_BACKTRACE: 1
        with:
          command: build
          args: --release --target ${{ matrix.target }} -p ${{ needs.check-version.outputs.package_name }}

      - name: Set binary path variables
        shell: bash
        run: |
          PACKAGE_NAME="${{ needs.check-version.outputs.package_name }}"
          FULL_BIN_PATH="${{ matrix.bin_path }}/${PACKAGE_NAME}${{ matrix.extension || '' }}"
          FULL_ASSET_NAME="${PACKAGE_NAME}${{ matrix.asset_name }}"
          FULL_BIN_PATH=$(echo "$FULL_BIN_PATH" | tr -d '[:space:]')

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "FULL_BIN_PATH=${FULL_BIN_PATH}" >> $GITHUB_ENV
          echo "FULL_ASSET_NAME=${FULL_ASSET_NAME}" >> $GITHUB_ENV

          echo "Debug info:"
          echo "- Package name: [$PACKAGE_NAME]"
          echo "- Binary path: [$FULL_BIN_PATH]"
          echo "- Asset name: [$FULL_ASSET_NAME]"

          if [ -f "${FULL_BIN_PATH}" ]; then
            echo "✅ Binary exists at: ${FULL_BIN_PATH}"
            ls -la "${FULL_BIN_PATH}"
          else
            echo "❌ Binary NOT found at: ${FULL_BIN_PATH}"
            echo "Contents of target directory:"
            find target -type f | grep -E "(\\.exe$|\\.wasm$|/${PACKAGE_NAME}$)" | sort
          fi

      - name: Generate SHA256
        shell: bash
        run: |
          echo "Checking binary at: [$FULL_BIN_PATH]"
          ls -l "$FULL_BIN_PATH" || (echo "❌ ERROR: Binary still not found at $FULL_BIN_PATH" && find target -type f | grep -E "(\\.exe$|\\.wasm$|/${PACKAGE_NAME}$)" | sort && exit 1)
          echo "Generating SHA256 for $FULL_BIN_PATH"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            sha256sum "$FULL_BIN_PATH" > "$FULL_BIN_PATH.sha256"
          else
            shasum -a 256 "$FULL_BIN_PATH" > "$FULL_BIN_PATH.sha256"
          fi
          echo "SHA256 file contents:"
          cat "$FULL_BIN_PATH.sha256"

      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.FULL_BIN_PATH }}
          asset_name: ${{ env.FULL_ASSET_NAME }}
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload SHA256
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.FULL_BIN_PATH }}.sha256
          asset_name: ${{ env.FULL_ASSET_NAME }}.sha256
          asset_content_type: text/plain
        continue-on-error: true

  cross-builds:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            asset_suffix: -linux-arm64
            openssl_arch: arm64
          - target: i686-unknown-linux-gnu
            asset_suffix: -linux-i686
            openssl_arch: i386
          - target: armv7-unknown-linux-gnueabihf
            asset_suffix: -linux-armv7
            openssl_arch: armhf

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Set variables
        run: |
          PACKAGE_NAME="${{ needs.check-version.outputs.package_name }}"
          ASSET_NAME="${PACKAGE_NAME}${{ matrix.asset_suffix }}"
          BIN_PATH="target/${{ matrix.target }}/release/${PACKAGE_NAME}${{ matrix.extension || '' }}"
          BIN_PATH=$(echo "$BIN_PATH" | tr -d '[:space:]')

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_ENV
          echo "BIN_PATH=${BIN_PATH}" >> $GITHUB_ENV

          echo "Cross-build variables:"
          echo "- Package: [$PACKAGE_NAME]"
          echo "- Asset name: [$ASSET_NAME]"
          echo "- Binary path: [$BIN_PATH]"

      - name: Configure cross for OpenSSL
        if: ${{ !matrix.no_openssl }}
        run: |
          cat > Cross.toml << EOF
          [target.${{ matrix.target }}]
          pre-build = [
              "dpkg --add-architecture ${{ matrix.openssl_arch }}",
              "apt-get update",
              "apt-get install -y libssl-dev:${{ matrix.openssl_arch }} libglib2.0-dev:${{ matrix.openssl_arch }} libgtk-3-dev:${{ matrix.openssl_arch }} libsoup-3.0-dev:${{ matrix.openssl_arch }} libjavascriptcoregtk-4.1-dev:${{ matrix.openssl_arch }} libxkbcommon-x11-0:${{ matrix.openssl_arch }} libxkbcommon-x11-dev:${{ matrix.openssl_arch }}"
          ]
          EOF
          cat Cross.toml

      - name: Build WebAssembly
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p ${{ needs.check-version.outputs.package_name }}

      - name: Build with cross
        if: matrix.target != 'wasm32-unknown-unknown'
        run: |
          cross build --release --target ${{ matrix.target }} -p ${{ needs.check-version.outputs.package_name }}

      - name: Generate SHA256
        run: |
          echo "Checking binary at: [$BIN_PATH]"
          ls -l "$BIN_PATH" || (echo "❌ ERROR: Binary not found at $BIN_PATH" && find target -type f | grep -E "(\\.exe$|\\.wasm$|/${PACKAGE_NAME}$)" | sort && exit 1)
          echo "Generating SHA256 for $BIN_PATH"
          sha256sum "$BIN_PATH" > "$BIN_PATH.sha256"
          echo "SHA256 file contents:"
          cat "$BIN_PATH.sha256"

      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.BIN_PATH }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/octet-stream

      - name: Upload SHA256
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.BIN_PATH }}.sha256
          asset_name: ${{ env.ASSET_NAME }}.sha256
          asset_content_type: text/plain

  generate-patches:
    needs: [check-version, create-release, build-release, cross-builds]
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.has_previous == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Build patch tool
        run: cargo build --release -p pulsar-patch-tool

      - name: Set variables
        id: vars
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PREV_VERSION="${{ needs.check-version.outputs.previous_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "patch_tool=target/release/pulsar-patch-tool" >> $GITHUB_OUTPUT

          cat > platforms.json << 'EOF'
          {
            "targets": [
              {"triple": "x86_64-pc-windows-msvc", "asset": "pulsar-installer-windows-x86_64.exe", "ext": ".exe"},
              {"triple": "i686-pc-windows-msvc", "asset": "pulsar-installer-windows-i686.exe", "ext": ".exe"},
              {"triple": "aarch64-pc-windows-msvc", "asset": "pulsar-installer-windows-arm64.exe", "ext": ".exe"},
              {"triple": "aarch64-apple-darwin", "asset": "pulsar-installer-macos-arm64", "ext": ""},
              {"triple": "x86_64-unknown-linux-gnu", "asset": "pulsar-installer-linux-x86_64", "ext": ""},
              {"triple": "aarch64-unknown-linux-gnu", "asset": "pulsar-installer-linux-arm64", "ext": ""},
              {"triple": "i686-unknown-linux-gnu", "asset": "pulsar-installer-linux-i686", "ext": ""},
              {"triple": "armv7-unknown-linux-gnueabihf", "asset": "pulsar-installer-linux-armv7", "ext": ""}
            ]
          }
          EOF

      - name: Download current release binaries
        run: gh release download "v${{ needs.check-version.outputs.version }}" --dir ./current-binaries --pattern "pulsar-installer-*" --skip-existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous release binaries
        run: gh release download "v${{ needs.check-version.outputs.previous_version }}" --dir ./prev-binaries --pattern "pulsar-installer-*" --skip-existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate patches and manifest
        run: |
          mkdir -p ./patches
          VERSION="${{ needs.check-version.outputs.version }}"
          PREV_VERSION="${{ needs.check-version.outputs.previous_version }}"
          PATCH_TOOL="./target/release/pulsar-patch-tool"
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          MANIFEST=$(cat << 'MANIFEST_START'
          {
            "schema_version": 1,
            "latest_version": "${VERSION}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {}
          }
          MANIFEST_START
          )
          # Replace version and date
          MANIFEST=$(echo "$MANIFEST" | sed "s|\${VERSION}|${VERSION}|g")
          MANIFEST=$(echo "$MANIFEST" | sed "s|\$(date -u +%Y-%m-%dT%H:%M:%SZ)|$(date -u +%Y-%m-%dT%H:%M:%SZ)|g")

          PLATFORMS="{}"

          for TRIPLE in x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu i686-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
            case "$TRIPLE" in
              *windows*) ASSET="pulsar-installer-${TRIPLE##*-}-${TRIPLE%%-*}"; EXT=".exe" ;;
              *x86_64-pc-windows*) ASSET="pulsar-installer-windows-x86_64.exe"; EXT=".exe" ;;
              *i686-pc-windows*) ASSET="pulsar-installer-windows-i686.exe"; EXT=".exe" ;;
              *aarch64-pc-windows*) ASSET="pulsar-installer-windows-arm64.exe"; EXT=".exe" ;;
              *aarch64-apple*) ASSET="pulsar-installer-macos-arm64"; EXT="" ;;
              *x86_64-linux*) ASSET="pulsar-installer-linux-x86_64"; EXT="" ;;
              *aarch64-linux*) ASSET="pulsar-installer-linux-arm64"; EXT="" ;;
              *i686-linux*) ASSET="pulsar-installer-linux-i686"; EXT="" ;;
              *armv7*) ASSET="pulsar-installer-linux-armv7"; EXT="" ;;
              *) continue ;;
            esac

            CURRENT_FILE="./current-binaries/${ASSET}"
            PREV_FILE="./prev-binaries/${ASSET}"

            if [ ! -f "$CURRENT_FILE" ] || [ ! -f "$PREV_FILE" ]; then
              echo "Skipping ${TRIPLE}: missing binary (current=${CURRENT_FILE}, prev=${PREV_FILE})"
              continue
            fi

            echo "Generating patch: ${TRIPLE}"
            PATCH_ASSET="pulsar-installer-patch-${PREV_VERSION}-${VERSION}-${ASSET}.zst"

            if "$PATCH_TOOL" generate-patch \
              --old-binary "$PREV_FILE" \
              --new-binary "$CURRENT_FILE" \
              --output "./patches/${PATCH_ASSET}" 2>/dev/null; then

              PATCH_SHA256=$("$PATCH_TOOL" sha256 --file "./patches/${PATCH_ASSET}")
              PATCH_SIZE=$(stat -c%s "./patches/${PATCH_ASSET}" 2>/dev/null || stat -f%z "./patches/${PATCH_ASSET}")

              FULL_SHA256=""
              FULL_SIZE=$(stat -c%s "$CURRENT_FILE" 2>/dev/null || stat -f%z "$CURRENT_FILE")
              if [ -f "${CURRENT_FILE}.sha256" ]; then
                FULL_SHA256=$(cat "${CURRENT_FILE}.sha256" | awk '{print $1}')
              else
                FULL_SHA256=$("$PATCH_TOOL" sha256 --file "$CURRENT_FILE")
              fi

              PATCH_ENTRY="{\"from_version\": \"${PREV_VERSION}\", \"to_version\": \"${VERSION}\", \"asset_name\": \"${PATCH_ASSET}\", \"url\": \"${RELEASE_BASE}/${PATCH_ASSET}\", \"sha256\": \"${PATCH_SHA256}\", \"size_bytes\": ${PATCH_SIZE}}"

              PLATFORM_ENTRY=$(echo "$PLATFORMS" | jq --arg t "$TRIPLE" --arg an "$ASSET" --arg fu "${RELEASE_BASE}/${ASSET}" --arg fs "$FULL_SHA256" --argjson fsize "$FULL_SIZE" \
                '.[$t] = {full_asset_name: $an, full_url: $fu, full_sha256: $fs, full_size_bytes: $fsize, patches: []}')

              PLATFORMS=$(echo "$PLATFORMS" | jq --arg t "$TRIPLE" --argjson entry "$PATCH_ENTRY" '.[$t].patches += [$entry]')

              echo "Uploaded patch: ${PATCH_ASSET}"
            else
              echo "Patch generation failed for ${TRIPLE}, skipping"
            fi
          done

          MANIFEST=$(jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$PLATFORMS" \
            '{schema_version: 1, latest_version: $v, generated_at: $d, platforms: $p}')

          echo "$MANIFEST" > update-manifest.json
          echo "Generated update-manifest.json:"
          cat update-manifest.json

      - name: Upload patches
        run: |
          for f in ./patches/pulsar-installer-patch-*.zst; do
            if [ -f "$f" ]; then
              gh release upload "v${{ needs.check-version.outputs.version }}" "$f" --clobber || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign update manifest
        env:
          UPDATE_SIGNING_KEY_SEED: ${{ secrets.UPDATE_SIGNING_KEY_SEED }}
        run: |
          ./target/release/pulsar-patch-tool sign-manifest \
            --manifest update-manifest.json \
            --key "$UPDATE_SIGNING_KEY_SEED"

      - name: Upload update manifest
        run: gh release upload "v${{ needs.check-version.outputs.version }}" update-manifest.json update-manifest.json.sig --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
