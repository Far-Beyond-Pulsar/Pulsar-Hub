name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: pulsar-installer

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      previous_version: ${{ steps.check.outputs.previous_version }}
      has_previous: ${{ steps.check.outputs.has_previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compare installer versions
        id: check
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/installer/Cargo.toml | head -n1)"
          previous_version="$(git show HEAD^:crates/installer/Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n1 || true)"
          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "previous_version=${previous_version}" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_version" && "$current_version" != "$previous_version" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: ${previous_version} -> ${current_version}"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            echo "No release needed for ${current_version}"
          fi

  create-release:
    name: Create GitHub release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.check-version.outputs.version }}"
          gh release create "$tag" --title "Pulsar Hub ${tag}" --generate-notes
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.name }}
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    # Platform jobs are intentionally isolated: one unavailable runner or
    # package format must not block assets from other platforms.
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            suffix: -linux-x86_64
            extension: ''
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage
            suffix: -linux-arm64
            extension: ''
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            suffix: -windows-x86_64
            extension: .exe
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            formats: nsis
            suffix: -windows-arm64
            extension: .exe
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            formats: dmg
            suffix: -macos-x86_64
            extension: ''
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            formats: dmg
            suffix: -macos-arm64
            extension: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fuse3 libasound2-dev libfontconfig1-dev libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev libxkbcommon-x11-dev pkg-config
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Cargo Packager
        shell: bash
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build release binary
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" -p pulsar-installer
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cargo packager --release --packages pulsar-installer --target "${{ matrix.target }}" --formats "${{ matrix.formats }}" --out-dir dist
      - name: Add updater binary and checksums
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${PACKAGE_NAME}${{ matrix.extension }}"
          raw_name="${PACKAGE_NAME}${{ matrix.suffix }}${{ matrix.extension }}"
          test -f "$binary"
          cp "$binary" "dist/$raw_name"
          while IFS= read -r -d '' file; do sha256sum "$file" > "$file.sha256"; done < <(find dist -maxdepth 1 -type f -print0)
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Upload platform assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if [[ -d dist ]] && find dist -maxdepth 1 -type f -print -quit | grep -q .; then
            gh release upload "v${{ needs.check-version.outputs.version }}" dist/* --clobber || true
          else
            echo "No assets were produced for ${{ matrix.name }}"
          fi

  generate-patches:
    name: Generate update metadata
    needs: [check-version, create-release, package]
    if: always() && needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.has_previous == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build patch tool
        run: cargo build --release -p pulsar-patch-tool
      - name: Download current and previous updater binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          mkdir -p current-binaries prev-binaries
          for asset in pulsar-installer-linux-x86_64 pulsar-installer-linux-arm64 pulsar-installer-windows-x86_64.exe pulsar-installer-windows-arm64.exe pulsar-installer-macos-x86_64 pulsar-installer-macos-arm64; do
            gh release download "v${{ needs.check-version.outputs.version }}" --pattern "$asset" --dir current-binaries --clobber || true
            gh release download "v${{ needs.check-version.outputs.previous_version }}" --pattern "$asset" --dir prev-binaries --clobber || true
          done
      - name: Generate available patches and manifest
        env:
          UPDATE_SIGNING_KEY_SEED: ${{ secrets.UPDATE_SIGNING_KEY_SEED }}
        shell: bash
        run: |
          set -u
          version="${{ needs.check-version.outputs.version }}"
          previous="${{ needs.check-version.outputs.previous_version }}"
          patch_tool=./target/release/pulsar-patch-tool
          mkdir -p patches dist
          for current in current-binaries/pulsar-installer-*; do
            [[ -f "$current" ]] || continue
            asset="$(basename "$current")"
            previous_file="prev-binaries/$asset"
            if [[ ! -f "$previous_file" ]]; then
              echo "Skipping patch for $asset: previous binary unavailable"
              cp "$current" "dist/$asset"
              continue
            fi
            patch="patches/pulsar-installer-patch-${previous}-${version}-${asset}.zst"
            "$patch_tool" generate-patch --old-binary "$previous_file" --new-binary "$current" --output "$patch" || echo "Patch generation failed for $asset"
            cp "$current" "dist/$asset"
          done
          if gh release download "v${previous}" --pattern update-manifest.json --dir prev-release --clobber; then previous_manifest=(--prev-manifest prev-release/update-manifest.json); else previous_manifest=(); fi
          "$patch_tool" gen-manifest --release-dir dist "${previous_manifest[@]}" --latest-version "$version" --output update-manifest.json
          "$patch_tool" sign-manifest --manifest update-manifest.json --key "${UPDATE_SIGNING_KEY_SEED:-}" || echo "Manifest signing skipped or failed"
      - name: Upload update metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for file in patches/*.zst update-manifest.json update-manifest.json.sig; do
            [[ -f "$file" ]] && gh release upload "v${{ needs.check-version.outputs.version }}" "$file" --clobber || true
          done
